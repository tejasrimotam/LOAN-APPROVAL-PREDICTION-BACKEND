# PORT, DB_URL, DB_USER, DB_PASSWORD come from environment variables when deployed (Render).
# On your laptop the defaults after the colon are used: only change YOUR_MYSQL_PASSWORD.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/loan_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=tejasri

# To run WITHOUT MySQL (temporary in-memory DB), remove the # in the next line:
# spring.profiles.active=h2

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
